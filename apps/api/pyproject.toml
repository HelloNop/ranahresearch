[project]
name = "ranah-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "ranah-domain", "ranah-agents", "ranah-workflow"]

[tool.uv.sources]
ranah-domain = { workspace = true }
ranah-agents = { workspace = true }
ranah-workflow = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ranah_api"]
