[project]
name = "ranahresearch"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/*", "workers/orchestration"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "packages/domain/migrations/versions",
    ".claude",
    ".codex",
    ".opencode",
    ".agents",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["packages/domain/migrations/versions"]

[[tool.mypy.overrides]]
module = "temporalio.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "pypdf.*", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
