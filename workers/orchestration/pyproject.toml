[project]
name = "ranah-worker-orchestration"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ranah-workflow",
    "ranah-domain",
    "ranah-agents",
    "ranah-literature",
]

[tool.uv.sources]
ranah-workflow = { workspace = true }
ranah-domain = { workspace = true }
ranah-agents = { workspace = true }
ranah-literature = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ranah_worker_orchestration"]
