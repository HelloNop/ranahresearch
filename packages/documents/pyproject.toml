[project]
name = "ranah-documents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "pypdf>=5.1,<7",
    "ranah-domain",
    "ranah-literature",
]

[tool.uv.sources]
ranah-domain = { workspace = true }
ranah-literature = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ranah_documents"]
