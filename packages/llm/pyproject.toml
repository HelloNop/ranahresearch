[project]
name = "ranah-llm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ranah_llm"]
