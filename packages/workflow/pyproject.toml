[project]
name = "ranah-workflow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.7,<2",
    "pydantic-settings>=2.6,<3",
    "ranah-domain",
]

[tool.uv.sources]
ranah-domain = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ranah_workflow"]
